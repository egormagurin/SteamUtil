name: Build & deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *' # daily ~06:17 UTC — refresh the Steam data
  workflow_dispatch: {}   # manual "Run workflow" button

# Permissions needed to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Fetch Steam data
        run: node scripts/build-data.mjs
        env:
          DEPTH: '3000'               # most-wishlisted upcoming games to include
          FOLLOWERS_TOP: '150'        # top games to enrich with follower counts
          FOLLOWERS_CONCURRENCY: '1'  # sequential — Steam throttles concurrent bursts hard
          FOLLOWERS_THROTTLE: '1500'  # ms between follower requests; slow = high coverage

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true # auto-enable Pages (source = GitHub Actions) on first run

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
